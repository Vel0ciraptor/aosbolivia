version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: repuestoia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repuestoia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-R3pU3st01A_s3cr3t_2024!}
      POSTGRES_DB: ${POSTGRES_DB:-repuestoia_dev}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repuestoia} -d ${POSTGRES_DB:-repuestoia_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: repuestoia_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@repuestoia.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-PgAdm1n_R3pU3st0!2024}
    ports:
      - "5050:80"
    depends_on:
      - postgres

  app:
    build: .
    container_name: repuestoia_app
    restart: unless-stopped
    ports:
      - "3003:3003"
      - "3004:3004"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-repuestoia}:${POSTGRES_PASSWORD:-R3pU3st01A_s3cr3t_2024!}@postgres:5432/${POSTGRES_DB:-repuestoia_dev}?schema=public
      JWT_SECRET: ${JWT_SECRET:-repuestoia_super_secret_jwt_key_2024}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-repuestoia_refresh_secret_key_2024}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: 3004
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3003}
      APP_URL: ${APP_URL:-http://localhost:3004}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
