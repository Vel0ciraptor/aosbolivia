version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: repuestoia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: repuestoia
      POSTGRES_PASSWORD: repuestoia_secret
      POSTGRES_DB: repuestoia_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repuestoia -d repuestoia_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: repuestoia_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@repuestoia.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
